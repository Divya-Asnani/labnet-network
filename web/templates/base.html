<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabNet Network Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-brand">
            <i class="fa-solid fa-network-wired"></i>
            LabNet Network Portal
        </div>
        <nav class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Topology</a>
            <a href="/chat" class="{% if request.path == '/chat' %}active{% endif %}">TCP Chat</a>
            <a href="/files" class="{% if request.path == '/files' %}active{% endif %}">File Transfer</a>
            <a href="/network" class="{% if request.path == '/network' %}active{% endif %}">Monitoring</a>
        </nav>
        <div class="nav-user" style="display: flex; align-items: center; gap: 12px; margin-left: auto;">
            {% if session.get('user') %}
                <span style="font-size: 0.85rem; color: #475569; font-weight: 500;">
                    <i class="fa-solid fa-user-circle" style="color: #2563eb;"></i> {{ session['user']['display_name'] }} ({{ session['user']['role'] }})
                </span>
                <a href="/logout" style="font-size: 0.8rem; color: #dc2626; text-decoration: none; padding: 4px 8px; border: 1px solid #fecaca; border-radius: 4px; background: #fff5f5;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            {% else %}
                <a href="/login" style="font-size: 0.85rem; color: #2563eb; text-decoration: none; padding: 4px 10px; border: 1px solid #bfdbfe; border-radius: 4px; background: #eff6ff;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </a>
            {% endif %}
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
