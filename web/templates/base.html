<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabNet Network Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="top-nav">
        <div class="nav-brand">
            <i class="fa-solid fa-network-wired"></i>
            LabNet Network Portal
        </div>
        <nav class="nav-links">
            <a href="/" class="{% if request.path == '/' %}active{% endif %}">Topology</a>
            <a href="/chat" class="{% if request.path == '/chat' %}active{% endif %}">TCP Chat</a>
            <a href="/files" class="{% if request.path == '/files' %}active{% endif %}">File Transfer</a>
            <a href="/network" class="{% if request.path == '/network' %}active{% endif %}">Monitoring</a>
        </nav>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
